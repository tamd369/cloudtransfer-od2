name: make-ydy2-secret
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真写 PATHS_JSON_YDY2; false=只演练"
        required: false
        default: "true"
permissions:
  contents: read
jobs:
  mk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pynacl
      - env:
          PATHS_JSON: ${{ secrets.PATHS_JSON }}
          GH_PAT: ${{ secrets.GH_TOKEN }}
          REPO: tamd369/cloudtransfer-od2
        run: |
          set -e
          if [ "${{ inputs.apply }}" = "true" ]; then A="--apply"; else A=""; fi
          python3 _make_ydy2_paths.py $A
