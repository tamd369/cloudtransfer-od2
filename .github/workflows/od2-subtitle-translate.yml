name: od2-subtitle-translate

# [od2] 字幕翻译云流程: OneDrive2「字幕」目录的日文 srt → LLM 译中文 → 写回
#       「已翻译字幕」目录同名文件。同名已存在自动跳过 -> 定时多轮断点续跑。
# 公开仓库: 日志经 logmask 脱敏(文件名/远端/路径一律短哈希); 真值全部走 Secret。
# Secrets: RCLONE_CONF(onedrive2 配置) / PATHS_JSON / LLM_API_BASE / LLM_API_KEY
#          / TG_TOKEN / TG_CHAT_ID

on:
  schedule:
    - cron: "17 */4 * * *"        # 每 4 小时一轮(UTC 17/01/05/09/13/17/21)
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真翻译并上传, false=只列统计"
        required: false
        default: "true"
      limit:
        description: "本轮最多处理 N 个文件(0=不限)"
        required: false
        default: "0"
      only:
        description: "只处理某个文件(留空=全部)"
        required: false
        default: ""
      budget_min:
        description: "本轮时间预算(分钟)"
        required: false
        default: "480"
      workers:
        description: "并发数"
        required: false
        default: "3"

concurrency:
  group: od2-subtitle-translate
  cancel-in-progress: false

permissions:
  contents: read

env:
  PATHS_JSON: ${{ secrets.PATHS_JSON }}

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 550
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1
          df -h / | tail -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          test -s ~/.config/rclone/rclone.conf && echo "rclone 配置已写入"
          echo "配置里的远端:"
          grep -E '^\[' ~/.config/rclone/rclone.conf | sed 's/^/  /'

      - name: 跑字幕翻译
        env:
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SUB_WORKERS: ${{ inputs.workers || '3' }}
          APPLY: ${{ inputs.apply || 'true' }}
          LIMIT: ${{ inputs.limit || '0' }}
          ONLY: ${{ inputs.only }}
          BUDGET_MIN: ${{ inputs.budget_min || '480' }}
        run: |
          set -e
          ARGS="--budget-min $BUDGET_MIN"
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; else echo "(演练模式)"; fi
          if [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          python3 tools/od2_subtitle_translate.py $ARGS

      - name: 磁盘余量
        if: always()
        run: df -h / | tail -1
